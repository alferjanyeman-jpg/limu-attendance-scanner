<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قارئ باركود الحضور</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }
    h2 { color: #234; }
    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
    }
    #message { margin: 20px; }
  </style>
</head>
<body>
  <h2>قارئ باركود الحضور</h2>
  <div id="reader"></div>
  <p id="message">جاري تجهيز الكاميرا...</p>

  <script>
    const params = new URLSearchParams(location.search);
    const parentOrigin = params.get("parentOrigin");
    let scanner;
    let scanned = false;

    function showMessage(text) {
      document.getElementById("message").textContent = text;
    }

    async function startScanner() {
      if (!parentOrigin) {
        showMessage("يجب فتح القارئ من تطبيق الحضور");
        return;
      }

      let origin;
      try {
        origin = new URL(parentOrigin).origin;
      } catch (e) {
        showMessage("رابط التطبيق غير صحيح");
        return;
      }

      if (
        origin !== "https://script.google.com" &&
        !origin.endsWith(".googleusercontent.com")
      ) {
        showMessage("مصدر التطبيق غير مسموح");
        return;
      }

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 180 } },
          async function(decodedText) {
            if (scanned) return;
            scanned = true;

            showMessage("تمت قراءة الباركود");

            try {
              await scanner.stop();

              window.opener.postMessage(
                {
                  type: "LIU_BARCODE_SCANNED",
                  barcode: decodedText
                },
                origin
              );

              setTimeout(() => window.close(), 500);

            } catch (error) {
              showMessage("تعذر إرسال الرقم للتطبيق");
              scanned = false;
            }
          }
        );

        showMessage("وجهي الكاميرا نحو الباركود");

      } catch (error) {
        showMessage("تعذر تشغيل الكاميرا: " + error);
      }
    }

    startScanner();
  </script>
</body>
</html>
